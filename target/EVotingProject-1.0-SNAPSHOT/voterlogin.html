<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
    content="width=device-width, initial-scale=1.0">

    <title>Voter Login</title>

    <link href=
    "https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet">
    <link rel="stylesheet" href="style.css" type="text/css"/>


    <style>
.login-box{

    margin-top:20px;
}
html, body{
    height:100%;
    margin:0;
    padding:0;
}

body{

    min-height:100vh;

    display:flex;

    flex-direction:column;
}

/* MAIN PAGE CONTENT */

.main-container{

    flex:1;
}
.footer{

    width:100%;

    background:rgba(0,0,0,0.88);

    color:white;

    text-align:center;

    padding:15px;

    font-size:18px;

    font-weight:bold;

    letter-spacing:1px;

    box-shadow:0px -2px 10px rgba(0,0,0,0.3);
}

.footer span{

    color:#00bfff;

    font-size:20px;

    text-shadow:0px 0px 10px #00bfff;
}

        body{

            margin:0;
            padding:0;

            height:100vh;

            display:flex;
            justify-content:center;
            align-items:center;

            font-family:Arial, sans-serif;

            background:
            linear-gradient(rgba(0,0,0,0.7),
            rgba(0,0,0,0.7)),

            url('https://images.unsplash.com/photo-1529107386315-e1a2ed48a620?q=80&w=1400&auto=format&fit=crop');

            background-size:cover;
            background-position:center;
        }

        .login-box{

            width:420px;

            background:white;

            padding:40px;

            border-radius:25px;

            box-shadow:0px 0px 25px rgba(0,0,0,0.4);
        }

        .icon{

            text-align:center;

            font-size:70px;

            margin-bottom:10px;
        }

        h2{

            text-align:center;

            color:#198754;

            font-weight:bold;

            margin-bottom:30px;
        }

        .form-control{

            height:50px;

            border-radius:10px;
        }

        .btn-login{

            width:100%;

            height:50px;

            border:none;

            border-radius:12px;

            font-size:18px;

            font-weight:bold;

            background:
            linear-gradient(45deg,#198754,#0f5c38);

            color:white;

            transition:0.3s;
        }

        .btn-login:hover{

            transform:translateY(-5px);

            box-shadow:0px 8px 20px rgba(0,0,0,0.3);
        }

        .back{

            text-align:center;

            margin-top:20px;
        }

        .back a{

            text-decoration:none;

            color:#198754;

            font-weight:bold;
        }

        .register{

            text-align:center;

            margin-top:15px;
        }

        .register a{

            text-decoration:none;

            color:#ff8800;

            font-weight:bold;
        }
/* FOOTER */

.footer{

    width:100%;

    background:rgba(0,0,0,0.85);

    color:white;

    text-align:center;

    padding:15px;

    font-size:18px;

    font-weight:bold;

    letter-spacing:1px;

    margin-top:40px;

    box-shadow:0px -2px 10px rgba(0,0,0,0.3);
}

.footer span{

    color:#00bfff;

    font-size:20px;

    text-shadow:0px 0px 10px #00bfff;
}
    </style>

</head>

<body>

    <div class="login-box">

        <div class="icon">

            🧑‍💼

        </div>

        <h2>Voter Login</h2>

        <form action="VoterLogin5"
        method="post">

            <!-- VOTER ID -->

            <div class="mb-3">

                <label class="form-label">

                    Voter ID

                </label>

                <input type="number"
                name="voter_id"
                class="form-control"
                placeholder="Enter Voter ID"
                required>

            </div>

            <!-- PASSWORD -->

            <div class="mb-4">

                <label class="form-label">

                    Password

                </label>

                <input type="password"
                name="password"
                class="form-control"
                placeholder="Enter Password"
                required>

            </div>

            <!-- LOGIN BUTTON -->

            <button type="submit"
            class="btn-login">

                Login

            </button>

        </form>

        <!-- REGISTER LINK -->

        <div class="register">

            New voter?

            <a href="voterregister.jsp">

                Register Here

            </a>

        </div>

        <!-- BACK -->

        <div class="back">

            <a href="index.jsp">

                ← Back to Home

            </a>

        </div>

    </div>
<!-- FOOTER -->

<div class="footer">

    Developed By 🚀

    <span>

        ANKIT KUMAR SHAH

    </span>

</div>
</body>

</html>

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Login</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
.login-box{

    margin-top:60px;
}
        body{

            margin:0;
            padding:0;

            height:100vh;

            display:flex;
            justify-content:center;
            align-items:center;

            font-family:Arial, sans-serif;

            background:
            linear-gradient(rgba(0,0,0,0.7),
            rgba(0,0,0,0.7)),

            url('https://images.unsplash.com/photo-1520607162513-77705c0f0d4a?q=80&w=1400&auto=format&fit=crop');

            background-size:cover;
            background-position:center;
        }

        .login-box{

            width:420px;

            background:white;

            padding:40px;

            border-radius:20px;

            box-shadow:0px 0px 25px rgba(0,0,0,0.4);
        }

        .icon{

            text-align:center;

            font-size:70px;

            margin-bottom:10px;
        }

        h2{

            text-align:center;

            color:#0d6efd;

            font-weight:bold;

            margin-bottom:30px;
        }

        .form-control{

            height:50px;

            border-radius:10px;
        }

        .btn-login{

            width:100%;

            height:50px;

            font-size:18px;

            border-radius:10px;
        }

        .back{

            text-align:center;

            margin-top:20px;
        }

        .back a{

            text-decoration:none;

            color:#0d6efd;

            font-weight:bold;
        }
/* FOOTER */

.footer{

    width:100%;

    background:rgba(0,0,0,0.85);

    color:white;

    text-align:center;

    padding:15px;

    font-size:18px;

    font-weight:bold;

    letter-spacing:1px;

    margin-top:40px;

    box-shadow:0px -2px 10px rgba(0,0,0,0.3);
}

.footer span{

    color:#00bfff;

    font-size:20px;

    text-shadow:0px 0px 10px #00bfff;
}
html, body{
    height:100%;
    margin:0;
    padding:0;
}

body{

    min-height:100vh;

    display:flex;

    flex-direction:column;
}

/* MAIN PAGE CONTENT */

.main-container{

    flex:1;
}
.footer{

    width:100%;

    background:rgba(0,0,0,0.88);

    color:white;

    text-align:center;

    padding:15px;

    font-size:18px;

    font-weight:bold;

    letter-spacing:1px;

    box-shadow:0px -2px 10px rgba(0,0,0,0.3);
}

.footer span{

    color:#00bfff;

    font-size:20px;

    text-shadow:0px 0px 10px #00bfff;
}
    </style>

</head>

<body>

 <div class="main-container">

           <div class="login-box">

        <div class="icon">

            👨‍💼

        </div>

        <h2>Admin Login</h2>

        <form action="Adminlogin" method="post">

            <div class="mb-3">

                <label class="form-label">

                    Username

                </label>

                <input type="text"
                name="username"
                class="form-control"
                placeholder="Enter Username"
                required>

            </div>

            <div class="mb-4">

                <label class="form-label">

                    Password

                </label>

                <input type="password"
                name="password"
                class="form-control"
                placeholder="Enter Password"
                required>

            </div>

            <button type="submit"
            class="btn btn-primary btn-login">

                Login

            </button>

        </form>

        <div class="back">

            <a href="index.jsp">

                ← Back to Home

            </a>

        </div>

    </div>

    </div>

    <div class="footer">

        Developed By 🚀
        <span>ANKIT KUMAR SHAH</span>

    </div>
</body>

</html>

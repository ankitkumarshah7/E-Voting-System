<!DOCTYPE html>
<html>
<head>

<title>Super Admin Login</title>

<link href=
"https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
rel="stylesheet">

<style>

body{

    margin:0;
    padding:0;

    font-family:Arial,sans-serif;

    background:
    linear-gradient(
    rgba(0,0,0,0.65),
    rgba(0,0,0,0.65)
    ),

    url('https://images.unsplash.com/photo-1529107386315-e1a2ed48a620?q=80&w=1600&auto=format&fit=crop');

    background-size:cover;
    background-position:center;

    height:100vh;

    display:flex;
    justify-content:center;
    align-items:center;
}

.login-box{

    width:450px;

    background:rgba(255,255,255,0.95);

    backdrop-filter:blur(10px);

    padding:35px;

    border-radius:25px;

    box-shadow:0px 0px 25px rgba(0,0,0,0.4);
}

.title{

    text-align:center;

    font-size:32px;

    font-weight:bold;

    color:#dc3545;

    margin-bottom:25px;
}

.form-control{

    height:50px;

    border-radius:12px;
}

.btn-login{

    width:100%;

    height:50px;

    border:none;

    border-radius:12px;

    background:#dc3545;

    color:white;

    font-size:18px;

    font-weight:bold;

    transition:0.3s;
}

.btn-login:hover{

    background:#bb2d3b;

    transform:translateY(-2px);
}

.btn-back{

    width:100%;

    height:50px;

    border:none;

    border-radius:12px;

    background:#0d6efd;

    color:white;

    font-size:18px;

    font-weight:bold;

    text-decoration:none;

    display:flex;

    justify-content:center;

    align-items:center;

    margin-top:15px;

    transition:0.3s;
}

.btn-back:hover{

    background:#0b5ed7;

    color:white;

    transform:translateY(-2px);
}

.footer{

    text-align:center;

    margin-top:20px;

    font-weight:bold;

    color:#555;
}

</style>

</head>

<body>

<div class="login-box">

<div class="title">

 Super Admin Login

</div>

<form action="superadmindashboard.jsp"
method="post">

<input
type="text"
name="username"
class="form-control mb-3"
placeholder="Enter Username"
required>

<input
type="password"
name="password"
class="form-control mb-3"
placeholder="Enter Password"
required>

<button
type="submit"
class="btn-login">

Login

</button>

</form>

<a href="landing.jsp"
class="btn-back">

Back To Home

</a>

<div class="footer">

E-Voting System | Super Admin Panel

</div>

</div>

</body>
</html>
